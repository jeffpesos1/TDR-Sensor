# Factory build for M5Stack AtomS3 Lite. This is what CI compiles
# into the pre-built firmware on the Releases page. Ships with no
# WiFi credentials, you provision from the browser at web.esphome.io
# (Improv over serial) or by joining the fallback hotspot. MQTT
# broker/credentials are set from the device web page too, see
# packages/tdr_provisioning.yaml. Same binary works for any number
# of devices on any number of networks.

substitutions:
  name: tdr-sensor
  friendly_name: TDR Sensor
  sdi12_data_pin: GPIO1
  sdi12_address: "0"
  sample_interval: 10s
  timezone: Pacific/Auckland

packages:
  board: !include ../packages/boards/atom-s3.yaml
  core: !include ../packages/tdr_sdi12_core.yaml
  analytics: !include ../packages/tdr_analytics.yaml
  wifi_extras: !include ../packages/wifi_extras.yaml
  provisioning: !include ../packages/tdr_provisioning.yaml

esphome:
  name_add_mac_suffix: true

wifi:
  ap: {}

improv_serial:

ota:
  - platform: esphome

dashboard_import:
  package_import_url: github://JakeTheRabbit/TDR-Sensor/esphome/import/atom-s3.yaml@main
  import_full_config: true
